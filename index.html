<body>
<header><button class="geri" id="geri" hidden aria-label="Geri">‹</button><h1 id="baslik">BEKAPSAĞLIK</h1></header>
<main id="ekran"></main>
<nav class="alt">
  <button data-git="bugun"><span class="s">🗓️</span>Bugün</button>
  <button data-git="kisiler"><span class="s">👨‍👩‍👧</span>Kişiler</button>
  <button data-git="dolap"><span class="s">💊</span>İlaç Dolabı</button>
  <button data-git="ayarlar"><span class="s">⚙️</span>Ayarlar</button>
</nav>
<div id="pencere-yeri"></div>
<div id="serit-yeri"></div>

<script>
"use strict";
/* ============ VERİ (yalnız bu telefonda, localStorage) ============ */
const ANAHTAR = "bekapsaglik_v1";
let V = yukle();
function bos(){ return {kisiler:[], randevular:[], ilaclar:[], tahliller:[], notlar:[], stok:[], receteler:[], alinan:{}, bildirilen:{}, ayar:{}}; }
function yukle(){
  try{ const t = localStorage.getItem(ANAHTAR); if(t){ const d = JSON.parse(t); return Object.assign(bos(), d); } }catch(e){}
  return bos();
}
function kaydet(){
  try{ localStorage.setItem(ANAHTAR, JSON.stringify(V)); }
  catch(e){ alert("Kaydedilemedi! Telefonun hafızası dolu olabilir. Ayarlar'dan yedek alın."); }
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
function yeniId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============ YARDIMCILAR ============ */
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AY_K = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const GUNLER = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const GUN_K = {1:"Pzt",2:"Sal",3:"Çar",4:"Per",5:"Cum",6:"Cmt",7:"Paz"};
const DILIMLER = [
  {k:"sabah", ad:"Sabah", s:"🌅", vars:"08:00"},
  {k:"ogle",  ad:"Öğle",  s:"☀️", vars:"13:00"},
  {k:"aksam", ad:"Akşam", s:"🌇", vars:"19:00"},
  {k:"gece",  ad:"Gece",  s:"🌙", vars:"22:00"}];
const KULLANIM = {ac:{ad:"Aç karnına",c:"e-ac"}, tok:{ad:"Tok karnına",c:"e-tok"}, yemek:{ad:"Yemekle birlikte",c:"e-yemek"}, fark:{ad:"Fark etmez",c:"e-fark"}};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iki = n => String(n).padStart(2,"0");
function bugunStr(d){ d = d || new Date(); return d.getFullYear()+"-"+iki(d.getMonth()+1)+"-"+iki(d.getDate()); }
function tarihObj(s){ const [y,m,g] = s.split("-").map(Number); return new Date(y, m-1, g); }
function gunFarki(a, b){ return Math.round((tarihObj(b) - tarihObj(a)) / 86400000); }
function tarihYaz(s){ if(!s) return ""; const d = tarihObj(s); return d.getDate()+" "+AYLAR[d.getMonth()]+" "+d.getFullYear()+", "+GUNLER[d.getDay()]; }
function tarihKisa(s){ if(!s) return ""; const d = tarihObj(s); return d.getDate()+" "+AYLAR[d.getMonth()]+" "+d.getFullYear(); }
function kalanYaz(s){
  const f = gunFarki(bugunStr(), s);
  if(f === 0) return "Bugün"; if(f === 1) return "Yarın"; if(f === -1) return "Dün";
  return f > 0 ? f+" gün sonra" : (-f)+" gün önce";
}
function kisi(id){ return V.kisiler.find(k => k.id === id) || {ad:"?"}; }
function basHarf(ad){ return (ad||"?").trim().charAt(0).toLocaleUpperCase("tr"); }
function haftaGunu(s){ const g = tarihObj(s).getDay(); return g === 0 ? 7 : g; }
function dilimBul(saat){ const h = +saat.slice(0,2); return h < 11 ? "sabah" : h < 15 ? "ogle" : h < 21 ? "aksam" : "gece"; }

/* İlaç o gün verilecek mi? */
function ilacBugunMu(il, gun){
  if(il.durdu) return false;
  if(il.bas && gun < il.bas) return false;
  if(il.bit && gun > il.bit) return false;
  if(il.siklik === "gunasiri"){ return gunFarki(il.bas || gun, gun) % 2 === 0; }
  if(il.siklik === "gunler"){ return (il.gunler||[]).includes(haftaGunu(gun)); }
  if(il.siklik === "lazim") return false;
  return true;
}
function siklikYaz(il){
  if(il.siklik === "gunasiri") return "Gün aşırı";
  if(il.siklik === "gunler") return "Haftada: " + (il.gunler||[]).sort().map(g=>GUN_K[g]).join(", ");
  if(il.siklik === "lazim") return "Gerektiğinde";
  return "Her gün";
}
function gunlukListe(gun){
  const liste = [];
  V.ilaclar.forEach(il => {
    if(!ilacBugunMu(il, gun)) return;
    (il.zamanlar||[]).forEach(z => liste.push({il, saat:z.saat, dilim:z.dilim || dilimBul(z.saat), anahtar: il.id+"@"+z.saat}));
  });
  return liste.sort((a,b) => a.saat.localeCompare(b.saat));
}

/* ============ YÖNLENDİRME ============ */
let durum = {ekran:"bugun", kid:null, sekme:"randevu"};
const gecmis = [];
function git(ekran, ek){ gecmis.push(Object.assign({}, durum)); durum = Object.assign({ekran}, ek||{}); ciz(); window.scrollTo(0,0); }
function geri(){ durum = gecmis.pop() || {ekran:"bugun"}; ciz(); }
document.getElementById("geri").onclick = geri;
document.querySelectorAll("nav.alt button").forEach(b => b.onclick = () => { gecmis.length = 0; durum = {ekran:b.dataset.git}; ciz(); window.scrollTo(0,0); });

function ciz(){
  const E = document.getElementById("ekran");
  document.querySelectorAll("nav.alt button").forEach(b => b.classList.toggle("on", b.dataset.git === (durum.ekran === "kisi" ? "kisiler" : durum.ekran === "dolapGrup" ? "dolap" : durum.ekran)));
  document.getElementById("geri").hidden = !["kisi","dolapGrup"].includes(durum.ekran);
  let bas = "BEKAPSAĞLIK";
  const kars = durum.ekran === "bugun" && karsilamaGoster();
  document.body.classList.toggle("karsilama-modu", kars);
  if(kars) E.innerHTML = ekranKarsilama();
  else if(durum.ekran === "bugun") E.innerHTML = ekranBugun();
  else if(durum.ekran === "kisiler"){ bas = "Kişiler"; E.innerHTML = ekranKisiler(); }
  else if(durum.ekran === "kisi"){ bas = kisi(durum.kid).ad; E.innerHTML = ekranKisi(); }
  else if(durum.ekran === "dolap"){ bas = "İlaç Dolabı"; E.innerHTML = ekranDolap(); }
  else if(durum.ekran === "dolapGrup"){ const h = ekranDolapGrup(); if(h === null){ geri(); return; } bas = "İlaç Dolabı"; E.innerHTML = h; }
  else if(durum.ekran === "ayarlar"){ bas = "Ayarlar"; E.innerHTML = ekranAyarlar(); listeBilgisi(); }
  document.getElementById("baslik").textContent = bas;
}

/* ============ BUGÜN ============ */
function ekranBugun(){
  const gun = bugunStr(), d = new Date();
  let h = kurBandi() + yedekBandi() + `<p class="gun-bas">${d.getDate()} ${AYLAR[d.getMonth()]} ${d.getFullYear()}, ${GUNLER[d.getDay()]}</p>`;
  if(!V.kisiler.length){
    return h + `<div class="kart"><div class="baslik">Hoş geldiniz 👋</div>
      <p>BEKAPSAĞLIK ile ailenizdeki kişilerin doktor randevularını, ilaçlarını ve tahlillerini tek yerden takip edebilirsiniz.</p>
      <p class="bilgi">Bütün bilgiler yalnız bu telefonda saklanır, hiçbir yere gönderilmez.</p>
      <button class="btn genis" onclick="kisiFormu()">＋ İlk kişiyi ekle</button></div>`;
  }
  // uyarılar: rapor bitişi
  V.ilaclar.forEach(il => {
    if(il.durdu || !il.rapor) return;
    const f = gunFarki(gun, il.rapor);
    if(f < 0) h += `<div class="uyari kirmizi">⚠️ <b>${esc(kisi(il.kid).ad)}</b> · ${esc(il.ad)}: ilaç raporunun süresi <b>${-f} gün önce doldu</b> (${tarihKisa(il.rapor)}).</div>`;
    else if(f <= 30) h += `<div class="uyari">📄 <b>${esc(kisi(il.kid).ad)}</b> · ${esc(il.ad)}: ilaç raporu <b>${f === 0 ? "bugün" : f+" gün sonra"}</b> bitiyor (${tarihKisa(il.rapor)}).</div>`;
  });
  const sg = V.stok.filter(s => s.adet > 0 && s.skt && gunFarki(gun, s.skt) < 0).length;
  const sy = V.stok.filter(s => s.adet > 0 && s.skt && gunFarki(gun, s.skt) >= 0 && gunFarki(gun, s.skt) <= 60).length;
  if(sg || sy) h += `<div class="uyari ${sg ? "kirmizi" : ""}" onclick="gecmis.length=0;durum={ekran:'dolap'};ciz()">💊 İlaç dolabı: ${sg ? `<b>${sg} ilacın tarihi geçmiş</b>` : ""}${sg && sy ? ", " : ""}${sy ? `<b>${sy} ilacın tarihi 60 gün içinde doluyor</b>` : ""}. Görmek için dokunun.</div>`;
  const liste = gunlukListe(gun);
  const alinan = V.alinan[gun] || {};
  const verilen = liste.filter(x => alinan[x.anahtar]).length;
  const yakin = yaklasanlar(7);
  h += `<div class="ozet"><div><b>${verilen}/${liste.length}</b><span>bugünkü ilaç</span></div><div><b>${yakin.length}</b><span>7 gün içinde randevu/tahlil</span></div></div>`;

  h += `<h2>💊 Bugünkü ilaçlar</h2>`;
  if(!liste.length) h += `<div class="bos">Bugün için kayıtlı ilaç saati yok.</div>`;
  DILIMLER.forEach(dl => {
    const grup = liste.filter(x => x.dilim === dl.k);
    if(!grup.length) return;
    h += `<div class="kart dilim"><div class="dilim-bas">${dl.s} ${dl.ad}</div>`;
    ["ac","tok","yemek","fark"].forEach(ku => {
      const alt = grup.filter(x => (x.il.kullanim||"fark") === ku);
      if(!alt.length) return;
      h += `<div class="alt-grup"><span class="etiket ${KULLANIM[ku].c}">${KULLANIM[ku].ad}</span></div>`;
      alt.forEach(x => {
        const ok = !!alinan[x.anahtar];
        h += `<div class="ilac-satir ${ok?"alindi":""}">
          <button class="tik ${ok?"on":""}" aria-label="Verildi" onclick="tikla('${x.anahtar}')">${ok?"✓":""}</button>
          <div style="flex:1"><div class="iad">${esc(x.il.ad)} <span class="bilgi">· ${esc(x.il.doz||"")}</span></div>
          <div class="bilgi">${esc(kisi(x.il.kid).ad)} · ${x.saat}${ok?" · verildi "+alinan[x.anahtar]:""}</div></div></div>`;
      });
    });
    h += `</div>`;
  });

  h += `<h2>📅 Yaklaşan randevu ve tahliller</h2>`;
  if(!yakin.length) h += `<div class="bos">Önümüzdeki 7 günde randevu ya da tahlil yok.</div>`;
  yakin.forEach(o => h += olayKarti(o, true));
  return h;
}
function tikla(anahtar){
  const gun = bugunStr();
  V.alinan[gun] = V.alinan[gun] || {};
  if(V.alinan[gun][anahtar]) delete V.alinan[gun][anahtar];
  else { const d = new Date(); V.alinan[gun][anahtar] = iki(d.getHours())+":"+iki(d.getMinutes()); }
  // 60 günden eski işaretleri temizle
  Object.keys(V.alinan).forEach(g => { if(gunFarki(g, gun) > 60) delete V.alinan[g]; });
  kaydet(); ciz();
}
function yaklasanlar(gunSay, kid){
  const gun = bugunStr(), out = [];
  V.randevular.forEach(r => { if(r.durum === "bekliyor" && (!kid || r.kid === kid)){ const f = gunFarki(gun, r.tarih); if(f >= 0 && f <= gunSay) out.push({tur:"randevu", o:r}); } });
  V.tahliller.forEach(t => { if(t.durum === "bekliyor" && t.tarih && (!kid || t.kid === kid)){ const f = gunFarki(gun, t.tarih); if(f >= 0 && f <= gunSay) out.push({tur:"tahlil", o:t}); } });
  return out.sort((a,b) => (a.o.tarih+(a.o.saat||"")).localeCompare(b.o.tarih+(b.o.saat||"")));
}
function olayKarti(x, kisiGoster){
  const o = x.o, d = o.tarih ? tarihObj(o.tarih) : null;
  const gecti = o.tarih && gunFarki(bugunStr(), o.tarih) < 0;
  const kutu = d ? `<div class="tarih-kutu ${gecti||o.durum!=="bekliyor"?"gecmis":""}"><div class="g">${d.getDate()}</div><div class="a">${AY_K[d.getMonth()]}</div><div class="a">${o.saat||""}</div></div>` : `<div class="tarih-kutu gecmis"><div class="g">?</div><div class="a">tarih yok</div></div>`;
  const fn = x.tur === "randevu" ? `randevuFormu('${o.id}')` : `tahlilFormu('${o.id}')`;
  let ust, alt;
  if(x.tur === "randevu"){
    ust = `🩺 ${esc(o.bolum||"Doktor randevusu")}${o.doktor?" · "+esc(o.doktor):""}`;
    alt = esc(o.hastane||"");
  } else {
    ust = `🧪 ${esc(o.ad)}`;
    alt = esc(o.yer||"") + (o.doktor ? " · İsteyen: "+esc(o.doktor) : "");
  }
  const dur = o.durum === "gidildi" ? `<span class="etiket e-yesil">${x.tur==="randevu"?"Gidildi":"Yapıldı"}</span>` :
              o.durum === "iptal" ? `<span class="etiket e-kirmizi">İptal</span>` :
              gecti ? `<span class="etiket e-sari">Tarihi geçti</span>` :
              o.tarih ? `<span class="etiket e-mavi">${kalanYaz(o.tarih)}</span>` : "";
  const notAlan = x.tur === "randevu" ? o.notlar : o.sonuc;
  return `<div class="kart olay" onclick="${fn}">${kutu}<div class="govde">
    <div class="baslik">${ust}</div>
    ${kisiGoster ? `<div class="bilgi">👤 ${esc(kisi(o.kid).ad)}</div>` : ""}
    ${alt ? `<div class="bilgi">📍 ${alt}</div>` : ""}
    <div style="margin-top:4px">${dur}</div>
    ${notAlan ? `<div class="not">${esc(notAlan)}</div>` : ""}
  </div></div>`;
}

/* ============ KİŞİLER ============ */
function ekranKisiler(){
  let h = `<button class="btn genis" onclick="kisiFormu()" style="margin-bottom:12px">＋ Kişi ekle</button>`;
  if(!V.kisiler.length) return h + `<div class="bos">Henüz kişi eklenmedi.<br>Örneğin “Babam” ya da adını yazarak başlayın.</div>`;
  V.kisiler.forEach(k => {
    const ilac = V.ilaclar.filter(i => i.kid === k.id && !i.durdu).length;
    const yak = yaklasanlar(3650, k.id).length;
    h += `<div class="kart kisi" onclick="git('kisi',{kid:'${k.id}',sekme:'randevu'})">
      <div class="avatar">${esc(basHarf(k.ad))}</div>
      <div><div class="ad">${esc(k.ad)}</div><div class="alt">${esc(k.yakinlik||"")}${k.yakinlik?" · ":""}${ilac} ilaç · ${yak} yaklaşan</div></div>
      <div class="ok">›</div></div>`;
  });
  return h;
}
function ekranKisi(){
  const k = kisi(durum.kid);
  const S = [["randevu","🩺 Randevular"],["recete","📋 Reçeteler"],["ilac","💊 İlaçlar"],["tahlil","🧪 Tahliller"],["not","📝 Notlar"],["bilgi","👤 Bilgiler"]];
  let h = `<div class="sekmeler">` + S.map(([s,a]) => `<button class="${durum.sekme===s?"on":""}" onclick="sekme('${s}')">${a}</button>`).join("") + `</div>`;
  if(durum.sekme === "randevu"){
    h += `<button class="btn genis" onclick="randevuFormu()" style="margin-bottom:12px">＋ Randevu ekle</button>`;
    const rs = V.randevular.filter(r => r.kid === k.id);
    const yak = rs.filter(r => r.durum === "bekliyor" && gunFarki(bugunStr(), r.tarih) >= 0).sort((a,b)=>(a.tarih+a.saat).localeCompare(b.tarih+b.saat));
    const gec = rs.filter(r => !yak.includes(r)).sort((a,b)=>(b.tarih+b.saat).localeCompare(a.tarih+a.saat));
    h += `<h2>Yaklaşan</h2>` + (yak.length ? yak.map(r => olayKarti({tur:"randevu",o:r})).join("") : `<div class="bos">Yaklaşan randevu yok.</div>`);
    if(gec.length) h += `<h2>Geçmiş randevular</h2>` + gec.map(r => olayKarti({tur:"randevu",o:r})).join("");
  }
  else if(durum.sekme === "recete"){ h += receteListesiHTML(k.id); }
  else if(durum.sekme === "ilac"){
    h += `<div class="satir" style="margin-bottom:12px"><button class="btn" onclick="ilacKarekodlaEkle()">📷 Karekodla ekle</button><button class="btn ikincil" onclick="ilacFormu()">✍️ Elle ekle</button></div>`;
    const is = V.ilaclar.filter(i => i.kid === k.id);
    const aktif = is.filter(i => !i.durdu), biten = is.filter(i => i.durdu);
    if(aktif.length) h += gunlukOzet(aktif);
    h += `<h2>Kullandığı ilaçlar</h2>` + (aktif.length ? aktif.map(ilacKarti).join("") : `<div class="bos">Kayıtlı ilaç yok.</div>`);
    if(biten.length) h += `<h2>Bırakılan ilaçlar</h2>` + biten.map(ilacKarti).join("");
  }
  else if(durum.sekme === "tahlil"){
    h += `<button class="btn genis" onclick="tahlilFormu()" style="margin-bottom:12px">＋ Tahlil ekle</button>`;
    const ts = V.tahliller.filter(t => t.kid === k.id).sort((a,b)=>((b.tarih||"9")+(b.saat||"")).localeCompare((a.tarih||"9")+(a.saat||"")));
    const bekl = ts.filter(t => t.durum === "bekliyor"), diger = ts.filter(t => t.durum !== "bekliyor");
    h += `<h2>Yapılacak tahliller</h2>` + (bekl.length ? bekl.reverse().map(t => olayKarti({tur:"tahlil",o:t})).join("") : `<div class="bos">Bekleyen tahlil yok.</div>`);
    if(diger.length) h += `<h2>Yapılan tahliller</h2>` + diger.map(t => olayKarti({tur:"tahlil",o:t})).join("");
  }
  else if(durum.sekme === "not"){
    h += `<button class="btn genis" onclick="notFormu()" style="margin-bottom:12px">＋ Not ekle</button>`;
    const ns = V.notlar.filter(n => n.kid === k.id).sort((a,b)=>b.tarih.localeCompare(a.tarih));
    const rn = V.randevular.filter(r => r.kid === k.id && r.notlar).sort((a,b)=>b.tarih.localeCompare(a.tarih));
    h += ns.length ? ns.map(n => `<div class="kart" onclick="notFormu('${n.id}')"><div class="bilgi">${tarihKisa(n.tarih)}</div><div class="not" style="margin-top:4px">${esc(n.metin)}</div></div>`).join("") : `<div class="bos">Henüz not yok.</div>`;
    if(rn.length) h += `<h2>Doktorların söyledikleri</h2>` + rn.map(r => `<div class="kart" onclick="randevuFormu('${r.id}')"><div class="baslik">🩺 ${esc(r.bolum||"")} ${r.doktor?"· "+esc(r.doktor):""}</div><div class="bilgi">${tarihKisa(r.tarih)} · ${esc(r.hastane||"")}</div><div class="not">${esc(r.notlar)}</div></div>`).join("");
  }
  else {
    h += `<div class="kart">
      <div class="kisi"><div class="avatar">${esc(basHarf(k.ad))}</div><div><div class="ad">${esc(k.ad)}</div><div class="alt">${esc(k.yakinlik||"")}</div></div></div>
      ${k.dogum ? `<p><b>Doğum tarihi:</b> ${tarihKisa(k.dogum)}</p>` : ""}
      ${k.kan ? `<p><b>Kan grubu:</b> ${esc(k.kan)}</p>` : ""}
      ${k.alerji ? `<p><b>Alerjiler:</b> ${esc(k.alerji)}</p>` : ""}
      ${k.hastalik ? `<p><b>Kronik hastalıklar:</b> ${esc(k.hastalik)}</p>` : ""}
      ${k.not ? `<div class="not">${esc(k.not)}</div>` : ""}
      <div class="islemler"><button class="btn ikincil" onclick="kisiFormu('${k.id}')">✏️ Düzenle</button></div></div>`;
  }
  return h;
}
function sekme(s){ durum.sekme = s; ciz(); }
function gunlukOzet(aktif){
  let h = `<h2>Günlük kullanım düzeni</h2><div class="kart">`;
  DILIMLER.forEach(dl => {
    const sat = [];
    aktif.forEach(il => (il.zamanlar||[]).forEach(z => { if((z.dilim||dilimBul(z.saat)) === dl.k) sat.push({il, saat:z.saat}); }));
    if(!sat.length) return;
    h += `<div style="margin-bottom:10px"><div class="baslik">${dl.s} ${dl.ad}</div>`;
    ["ac","tok","yemek","fark"].forEach(ku => {
      const a = sat.filter(x => (x.il.kullanim||"fark") === ku);
      if(a.length) h += `<div style="margin:3px 0"><span class="etiket ${KULLANIM[ku].c}">${KULLANIM[ku].ad}</span> ${a.map(x => esc(x.il.ad)+" ("+x.saat+")").join(", ")}</div>`;
    });
    h += `</div>`;
  });
  return h + `</div>`;
}
function ilacKarti(il){
  const zs = (il.zamanlar||[]).map(z => { const d = DILIMLER.find(x => x.k === (z.dilim||dilimBul(z.saat))); return d.s+" "+z.saat; }).join("  ");
  let rapor = "";
  if(il.rapor){
    const f = gunFarki(bugunStr(), il.rapor);
    rapor = `<div style="margin-top:4px"><span class="etiket ${f<0?"e-kirmizi":f<=30?"e-sari":"e-fark"}">📄 Rapor bitişi: ${tarihKisa(il.rapor)}${f<0?" (doldu)":""}</span></div>`;
  }
  return `<div class="kart" onclick="ilacFormu('${il.id}')" ${il.durdu?'style="opacity:.6"':""}>
    <div class="baslik">💊 ${esc(il.ad)} <span class="bilgi">· ${esc(il.doz||"")}</span></div>
    <div style="margin:4px 0"><span class="etiket ${KULLANIM[il.kullanim||"fark"].c}">${KULLANIM[il.kullanim||"fark"].ad}</span><span class="etiket e-fark">${siklikYaz(il)}</span></div>
    ${zs ? `<div class="bilgi">${zs}</div>` : ""}
    ${il.bit ? `<div class="bilgi">Bitiş: ${tarihKisa(il.bit)}</div>` : ""}
    ${rapor}
    ${!il.durdu ? stokKarsilastir(il) : ""}
    ${il.not ? `<div class="not">${esc(il.not)}</div>` : ""}
  </div>`;
}

/* ============ FORMLAR ============ */
function pencere(html){
  document.getElementById("pencere-yeri").innerHTML = `<div class="perde" onclick="if(event.target===this)kapat()"><div class="pencere">${html}</div></div>`;
  document.body.style.overflow = "hidden";
}
function kapat(){ document.getElementById("pencere-yeri").innerHTML = ""; document.body.style.overflow = ""; }
const deg = id => (document.getElementById(id).value || "").trim();
function alan(id, etiket, deger, tip, ipucu, ek){
  if(tip === "textarea") return `<label class="alan">${etiket}<textarea id="${id}" ${ek||""}>${esc(deger)}</textarea>${ipucu?`<div class="ipucu">${ipucu}</div>`:""}</label>`;
  return `<label class="alan">${etiket}<input id="${id}" type="${tip||"text"}" value="${esc(deger)}" ${ek||""}>${ipucu?`<div class="ipucu">${ipucu}</div>`:""}</label>`;
}
function secimKutusu(id, secenekler, secili){
  return `<div class="secim" id="${id}" data-deger="${esc(secili)}">` + secenekler.map(([k,a]) =>
    `<button type="button" class="${k===secili?"on":""}" onclick="secimYap('${id}','${k}',this)">${a}</button>`).join("") + `</div>`;
}
function secimYap(id, k, b){ const s = document.getElementById(id); s.dataset.deger = k; s.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); if(id === "f_siklik") document.getElementById("gunler-yer").hidden = k !== "gunler"; }
function sil(liste, id, soru){
  if(!confirm(soru)) return;
  V[liste] = V[liste].filter(x => x.id !== id); kaydet(); kapat(); ciz();
}

/* Kişi */
function kisiFormu(id){
  const k = id ? kisi(id) : {};
  pencere(`<h3>${id?"Kişiyi düzenle":"Yeni kişi"}</h3>
    ${alan("f_ad","Adı",k.ad,"text","Örnek: Babam, Ahmet Yılmaz")}
    ${alan("f_yak","Yakınlık",k.yakinlik,"text","Örnek: Baba, Anne, Kendim")}
    ${alan("f_dog","Doğum tarihi (isteğe bağlı)",k.dogum,"date")}
    ${alan("f_kan","Kan grubu (isteğe bağlı)",k.kan,"text","Örnek: A Rh+")}
    ${alan("f_alr","Alerjiler (isteğe bağlı)",k.alerji,"text","Örnek: Penisilin")}
    ${alan("f_has","Kronik hastalıklar (isteğe bağlı)",k.hastalik,"text","Örnek: Tansiyon, şeker")}
    ${alan("f_not","Not (isteğe bağlı)",k.not,"textarea")}
    <div class="satir"><button class="btn ikincil" onclick="kapat()">Vazgeç</button><button class="btn" onclick="kisiKaydet('${id||""}')">Kaydet</button></div>
    ${id ? `<div style="margin-top:16px"><button class="btn tehlike genis" onclick="kisiSil('${id}')">🗑️ Kişiyi ve bütün kayıtlarını sil</button></div>` : ""}`);
}
function kisiKaydet(id){
  const ad = deg("f_ad"); if(!ad){ alert("Lütfen bir ad yazın."); return; }
  const k = id ? kisi(id) : {id:yeniId()};
  Object.assign(k, {ad, yakinlik:deg("f_yak"), dogum:deg("f_dog"), kan:deg("f_kan"), alerji:deg("f_alr"), hastalik:deg("f_has"), not:deg("f_not")});
  if(!id) V.kisiler.push(k);
  kaydet(); kapat();
  if(!id) git("kisi", {kid:k.id, sekme:"randevu"}); else ciz();
}
function kisiSil(id){
  if(!confirm(kisi(id).ad + " ve ona ait bütün randevu, ilaç, tahlil ve notlar silinecek. Emin misiniz?")) return;
  V.receteler.filter(r => r.kid === id).forEach(r => (r.fotolar||[]).forEach(f => fotoSilDB(f).catch(() => {})));
  ["randevular","ilaclar","tahliller","notlar","receteler"].forEach(l => V[l] = V[l].filter(x => x.kid !== id));
  V.stok.forEach(s => { if(s.kime === id) s.kime = ""; });
  V.kisiler = V.kisiler.filter(k => k.id !== id);
  kaydet(); kapat(); gecmis.length = 0; durum = {ekran:"kisiler"}; ciz();
}

/* Randevu */
function randevuFormu(id){
  const r = id ? V.randevular.find(x => x.id === id) : {kid:durum.kid, durum:"bekliyor", hatirlat:"1g"};
  const kid = r.kid || durum.kid;

/* ============ TELEFON TAKVİMİNE ALARM (.ics) ============ */
function icsMetin(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function icsZaman(tarih, saat){ return tarih.replace(/-/g,"") + "T" + (saat||"09:00").replace(":","") + "00"; }
function icsSatir(s){ // RFC 5545: 75 baytta katla, harfi bölmeden
  const enc = new TextEncoder(), out = []; let satir = "", bayt = 0, sinir = 75;
  for(const ch of Array.from(s)){
    const n = enc.encode(ch).length;
    if(bayt + n > sinir){ out.push(satir); satir = " "; bayt = 1; sinir = 75; }
    satir += ch; bayt += n;
  }
  out.push(satir); return out.join("\r\n");
}
function icsDamga(){ const d = new Date(); return d.getUTCFullYear()+iki(d.getUTCMonth()+1)+iki(d.getUTCDate())+"T"+iki(d.getUTCHours())+iki(d.getUTCMinutes())+iki(d.getUTCSeconds())+"Z"; }
function takvimeEkle(tur, id){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//BEKAPSAGLIK//TR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  let dosya = "bekapsaglik";
  const alarm = (tetik, mesaj) => ["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsMetin(mesaj),"TRIGGER:"+tetik,"END:VALARM"];
  if(tur === "randevu" || tur === "tahlil"){
    const o = (tur === "randevu" ? V.randevular : V.tahliller).find(x => x.id === id);
    if(!o.tarih){ alert("Önce tarih girin."); return; }
    const k = kisi(o.kid).ad;
    const baslik = tur === "randevu" ? `${k} · ${o.bolum||"Doktor"} randevusu${o.doktor?" ("+o.doktor+")":""}` : `${k} · Tahlil: ${o.ad}`;
    const acik = [tur==="randevu" ? o.yer : "", o.hazirlik ? "Hazırlık: "+o.hazirlik : "", "BEKAPSAĞLIK"].filter(Boolean).join("\n");
    L.push("BEGIN:VEVENT","UID:"+o.id+"@bekapsaglik","DTSTAMP:"+icsDamga(),"DTSTART:"+icsZaman(o.tarih,o.saat),"DURATION:PT1H",
      "SUMMARY:"+icsMetin(baslik), "LOCATION:"+icsMetin(tur==="randevu"?o.hastane:o.yer), "DESCRIPTION:"+icsMetin(acik));
    const h = o.hatirlat || "1g";
    if(h === "1g" || h === "ikisi") L.push(...alarm("-P1D", "Yarın: "+baslik));
    if(h === "2s" || h === "ikisi") L.push(...alarm("-PT2H", "2 saat sonra: "+baslik));
    if(h === "yok") L.push(...alarm("-PT1H", baslik));
    L.push("END:VEVENT");
    dosya = (tur === "randevu" ? "randevu-" : "tahlil-") + o.tarih;
  } else {
    const il = V.ilaclar.find(x => x.id === id);
    const k = kisi(il.kid).ad;
    if(il.siklik === "lazim" || !(il.zamanlar||[]).length){ alert("'Gerektiğinde' alınan ilaç için saatli alarm kurulmaz."); return; }
    const bas = il.bas && il.bas > bugunStr() ? il.bas : bugunStr();
    let kural = "FREQ=DAILY";
    if(il.siklik === "gunasiri"){
      kural = "FREQ=DAILY;INTERVAL=2";
    } else if(il.siklik === "gunler"){
      const BY = {1:"MO",2:"TU",3:"WE",4:"TH",5:"FR",6:"SA",7:"SU"};
      kural = "FREQ=WEEKLY;BYDAY=" + (il.gunler||[]).sort().map(g => BY[g]).join(",");
    }
    if(il.bit) kural += ";UNTIL=" + il.bit.replace(/-/g,"") + "T235959";
    // gün aşırıda doğru günden başla
    let ilk = bas;
    if(il.siklik === "gunasiri" && il.bas && gunFarki(il.bas, ilk) % 2 !== 0){ const d = tarihObj(ilk); d.setDate(d.getDate()+1); ilk = bugunStr(d); }
    il.zamanlar.forEach(z => {
      const baslik = `💊 ${k}: ${il.ad}${il.doz?" ("+il.doz+")":""} · ${KULLANIM[il.kullanim||"fark"].ad}`;
      L.push("BEGIN:VEVENT","UID:"+il.id+"-"+z.saat.replace(":","")+"@bekapsaglik","DTSTAMP:"+icsDamga(),"DTSTART:"+icsZaman(ilk, z.saat),"DURATION:PT10M",
        "RRULE:"+kural,"SUMMARY:"+icsMetin(baslik),"DESCRIPTION:"+icsMetin([il.not, "BEKAPSAĞLIK"].filter(Boolean).join("\n")), ...alarm("PT0M", baslik), "END:VEVENT");
    });
    dosya = "ilac-" + il.ad.replace(/[^A-Za-z0-9ÇĞİÖŞÜçğıöşü]+/g,"-").slice(0,30);
  }
  L.push("END:VCALENDAR");
  const metin = L.map(icsSatir).join("\r\n") + "\r\n";
  const blob = new Blob([metin], {type:"text/calendar;charset=utf-8"});
  const ad = dosya + ".ics";
  indir(blob, ad);
}
function indir(blob, ad){
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = u; a.download = ad; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
  serit("📲 Takvim dosyası hazır", "Açılan dosyada “Takvime ekle”ye dokunun. (Dosya inenlere düştüyse oradan açın.)");
}

/* ============ UYGULAMA AÇIKKEN BİLDİRİM ============ */
function serit(b, m){
  const y = document.getElementById("serit-yeri");
  y.innerHTML = `<div class="bildirim-serit" onclick="this.remove()"><b>${esc(b)}</b>${esc(m)}</div>`;
  clearTimeout(serit.t); serit.t = setTimeout(() => { y.innerHTML = ""; }, 12000);
}
async function bildir(baslik, mesaj, etiket){
  serit(baslik, mesaj);
  if(navigator.vibrate) navigator.vibrate([300,150,300]);
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  try{
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg) reg.showNotification(baslik, {body:mesaj, tag:etiket, icon:"ikon-192.png", badge:"ikon-192.png", requireInteraction:true});
    else new Notification(baslik, {body:mesaj, tag:etiket});
  }catch(e){}
}
function kontrol(){
  const simdi = new Date(), gun = bugunStr(simdi), dk = simdi.getHours()*60 + simdi.getMinutes();
  let degisti = false;
  // ilaç saatleri (saatinden itibaren 60 dk içinde, verilmediyse bir kez)
  gunlukListe(gun).forEach(x => {
    const [h,m] = x.saat.split(":").map(Number), t = h*60+m;
    const k = "i:"+gun+":"+x.anahtar;
    if(dk >= t && dk < t+60 && !(V.alinan[gun]||{})[x.anahtar] && !V.bildirilen[k]){
      V.bildirilen[k] = 1; degisti = true;
      bildir("💊 İlaç saati: " + kisi(x.il.kid).ad, `${x.il.ad} ${x.il.doz||""} · ${KULLANIM[x.il.kullanim||"fark"].ad} (${x.saat})`, k);
    }
  });
  // randevu / tahlil: 1 gün ve 2 saat önce
  const olaylar = [...V.randevular.map(o => ({o, t:"r"})), ...V.tahliller.map(o => ({o, t:"t"}))];
  olaylar.forEach(({o,t}) => {
    if(o.durum !== "bekliyor" || !o.tarih || o.hatirlat === "yok") return;
    const z = tarihObj(o.tarih); const [h,m] = (o.saat||"09:00").split(":").map(Number); z.setHours(h, m, 0, 0);
    const fark = (z - simdi) / 60000;
    const ad = t === "r" ? `${o.bolum||"Doktor"} randevusu${o.doktor?" · "+o.doktor:""}` : `Tahlil: ${o.ad}`;
    const ust = kisi(o.kid).ad + " · " + ad;
    const yer = (t === "r" ? o.hastane : o.yer) || "";
    if((o.hatirlat === "1g" || o.hatirlat === "ikisi") && fark <= 1440 && fark > 120 && !V.bildirilen[t+":"+o.id+":1g"]){
      V.bildirilen[t+":"+o.id+":1g"] = 1; degisti = true; bildir("📅 Yarın: " + ust, `${tarihKisa(o.tarih)} saat ${o.saat||"?"} · ${yer}`, t+o.id);
    }
    if((o.hatirlat === "2s" || o.hatirlat === "ikisi") && fark <= 120 && fark > -30 && !V.bildirilen[t+":"+o.id+":2s"]){
      V.bildirilen[t+":"+o.id+":2s"] = 1; degisti = true; bildir("⏰ Yaklaşıyor: " + ust, `Saat ${o.saat||"?"} · ${yer}`, t+o.id);
    }
  });
  // eski bildirim kayıtlarını temizle
  Object.keys(V.bildirilen).forEach(k => { if(k.startsWith("i:") && gunFarki(k.slice(2,12), gun) > 3){ delete V.bildirilen[k]; degisti = true; } });
  if(degisti) kaydet();
}

/* ============ FOTOĞRAF DEPOSU (telefonun içinde, IndexedDB) ============ */
let _fdb;
function fdb(){ return _fdb || (_fdb = new Promise((ok,no) => { const r = indexedDB.open("bekapsaglik_foto", 1); r.onupgradeneeded = () => r.result.createObjectStore("f"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); })); }
async function fotoIslem(mod, fn){ const d = await fdb(); return new Promise((ok,no) => { const t = d.transaction("f", mod), q = fn(t.objectStore("f")); t.oncomplete = () => ok(q ? q.result : undefined); t.onerror = () => no(t.error); }); }
const fotoKoy = (id, v) => fotoIslem("readwrite", s => s.put(v, id));
const fotoAl = id => fotoIslem("readonly", s => s.get(id));
const fotoSilDB = id => fotoIslem("readwrite", s => s.delete(id));
async function fotoHepsi(){ const d = await fdb(); return new Promise((ok,no) => { const out = {}, t = d.transaction("f","readonly"), r = t.objectStore("f").openCursor(); r.onsuccess = () => { const c = r.result; if(c){ out[c.key] = c.value; c.continue(); } }; t.oncomplete = () => ok(out); t.onerror = () => no(t.error); }); }
async function fotoHepsiniSil(){ try{ await fotoIslem("readwrite", s => s.clear()); }catch(e){} }
async function fotoTemizle(){ // hiçbir kayda bağlı olmayan fotoğrafları sil
  try{
    const kull = new Set(); [...V.stok, ...V.receteler].forEach(x => (x.fotolar||[]).forEach(f => kull.add(f)));
    const d = await fdb(), t = d.transaction("f","readwrite"), s = t.objectStore("f"), r = s.getAllKeys();
    r.onsuccess = () => r.result.forEach(k => { if(!kull.has(k)) s.delete(k); });
  }catch(e){}
}
function fotoKucult(dosya, enBuyuk){
  return new Promise((ok,no) => {
    const img = new Image(), u = URL.createObjectURL(dosya);
    img.onload = () => {
      const o = Math.min(1, (enBuyuk||1600) / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width*o); c.height = Math.round(img.height*o);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); ok(c.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error("foto")); };
    img.src = u;
  });
}

/* ============ KAREKOD (İlaç Takip Sistemi kare kodu) ============ */
function sktGecerli(s){ if(!/^\d{6}$/.test(s)) return false; const a = +s.slice(2,4), g = +s.slice(4,6); return a >= 1 && a <= 12 && g <= 31; }
function gs1Coz(t){
  // ZXing-C++ ayırıcıyı "<GS>" yazısı olarak verebilir; gerçek ayırıcıya çevir
  t = String(t||"").trim().replace(/<GS>/gi, "\u001d").replace(/^\](d2|C1|Q3|e0)/, "").replace(/^\u001d/, "");
  const GS = "\u001d", r = {};
  if(/^\d{8}$|^\d{12,13}$/.test(t)){ r.barkod = t.length === 12 ? "0" + t : t; return r; }
  if(/^\(\d{2,4}\)/.test(t)){ // okunur biçim: (01)0869…(21)…(17)…(10)…
    const re = /\((\d{2,4})\)([^(]*)/g; let m;
    while((m = re.exec(t))){ const v = m[2].replace(/\u001d/g, "").trim();
      if(m[1] === "01") r.gtin = v; else if(m[1] === "17") r.skt = v; else if(m[1] === "10") r.parti = v; else if(m[1] === "21") r.seri = v; }
  } else if(t.includes(GS)){
    let i = 0;
    while(i < t.length){
      const ai = t.substr(i, 2); i += 2;
      if(ai === "01"){ r.gtin = t.substr(i, 14); i += 14; }
      else if(ai === "17"){ r.skt = t.substr(i, 6); i += 6; }
      else if(ai === "10" || ai === "21"){ let j = t.indexOf(GS, i); if(j < 0) j = t.length; r[ai === "10" ? "parti" : "seri"] = t.slice(i, j); i = j + 1; }
      else break;
    }
  } else if(/^01\d{14}/.test(t)){
    // ayraçsız: 01 + GTIN, sonra 21/17/10 sırası değişebilir; geçerli tarihli ilk bölünmeyi seç
    r.gtin = t.substr(2, 14); const g = t.slice(16);
    let m;
    if(g.startsWith("21")){
      for(let k = 3; k < g.length - 7; k++){
        if(g.substr(k, 2) === "17" && sktGecerli(g.substr(k + 2, 6)) && (k + 8 === g.length || g.substr(k + 8, 2) === "10")){
          r.seri = g.slice(2, k); r.skt = g.substr(k + 2, 6); if(k + 8 < g.length) r.parti = g.slice(k + 10); break;
        }
      }
    } else if((m = g.match(/^17(\d{6})10(.*)$/)) && sktGecerli(m[1])){
      r.skt = m[1];
      const rest = m[2], j = rest.lastIndexOf("21");
      if(j > 0){ r.parti = rest.slice(0, j); r.seri = rest.slice(j + 2); } else r.parti = rest;
    } else if((m = g.match(/^17(\d{6})/)) && sktGecerli(m[1])) r.skt = m[1];
  }
  if(r.gtin) r.barkod = r.gtin.replace(/^0/, "");
  if(r.skt && sktGecerli(r.skt)){
    const y = 2000 + +r.skt.slice(0,2), a = +r.skt.slice(2,4); let g = +r.skt.slice(4,6);
    if(g === 0) g = new Date(y, a, 0).getDate();
    r.skt = y + "-" + iki(a) + "-" + iki(g);
  } else delete r.skt;
  return r;
}
/* Kod okuyucular: önce telefonun kendi okuyucusu (Android Chrome: BarcodeDetector),
   yoksa ya da bulamazsa ZXing-C++ (WebAssembly, uygulamanın içinde: zxing_okuyucu.js + zxing_reader.wasm) */
let _yerli = undefined;
async function yerliOkuyucu(){
  if(_yerli !== undefined) return _yerli;
  _yerli = null;
  try{
    if("BarcodeDetector" in window){
      const f = await BarcodeDetector.getSupportedFormats();
      if(f.includes("data_matrix")) _yerli = new BarcodeDetector({formats:["data_matrix","ean_13","ean_8","upc_a","code_128","qr_code"].filter(x => f.includes(x))});
    }
  }catch(e){ _yerli = null; }
  return _yerli;
}
let _wasm = null;
function wasmYukle(){
  return _wasm || (_wasm = new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = "zxing_okuyucu.js";
    s.onload = () => {
      const wasmAdres = new URL("zxing_reader.wasm", location.href).href;
      Promise.resolve(ZXingWASM.prepareZXingModule({overrides:{locateFile:(p, on) => p.endsWith(".wasm") ? wasmAdres : on + p}, fireImmediately:true})).then(() => ok(), no);
    };
    s.onerror = no; document.head.appendChild(s);
  }).catch(e => { _wasm = null; throw e; }));
}
const WASM_AYAR = {formats:["DataMatrix","EAN13","EAN8","UPCA","Code128","QRCode"], tryHarder:true, tryRotate:true, tryInvert:true, tryDownscale:true, maxNumberOfSymbols:1};
async function wasmOku(girdi){
  await wasmYukle();
  const r = await ZXingWASM.readBarcodes(girdi, WASM_AYAR);
  const iyi = (r||[]).find(x => x.isValid !== false && x.text);
  return iyi ? iyi.text : null;
}
function ortaKes(kaynak, gen, yuk, oran, hedef){
  const k = Math.min(gen, yuk) * oran, x = (gen - k) / 2, y = (yuk - k) / 2;
  const c = document.createElement("canvas"); c.width = c.height = hedef;
  const ctx = c.getContext("2d", {willReadFrequently:true});
  ctx.drawImage(kaynak, x, y, k, k, 0, 0, hedef, hedef);
  return ctx.getImageData(0, 0, hedef, hedef);
}
async function resimdenOku(dosya){
  const yerli = await yerliOkuyucu();
  if(yerli){ try{ const bmp = await createImageBitmap(dosya); const r = await yerli.detect(bmp); if(r.length) return r[0].rawValue; }catch(e){} }
  try{ const t = await wasmOku(dosya); if(t) return t; }catch(e){}
  try{
    const bmp = await createImageBitmap(dosya);
    for(const oran of [0.5, 0.3]){ const t = await wasmOku(ortaKes(bmp, bmp.width, bmp.height, oran, 1200)); if(t) return t; }
  }catch(e){}
  return null;
}
/* Okuma sesi (deklanşör benzeri). Telefon sessizdeyse iPhone çalmayabilir. */
let _ses = null;
function sesHazirla(){ try{ _ses = _ses || new (window.AudioContext || window.webkitAudioContext)(); if(_ses.state === "suspended") _ses.resume(); }catch(e){} }
function sesCal(tur){
  if(!_ses) return;
  try{
    const c = _ses, t0 = c.currentTime + 0.01;
    if(tur === "ok"){
      [0, 0.075].forEach((d, k) => {
        const n = Math.floor(c.sampleRate * 0.05), b = c.createBuffer(1, n, c.sampleRate), v = b.getChannelData(0);
        for(let i = 0; i < n; i++) v[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
        const s = c.createBufferSource(); s.buffer = b;
        const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = k ? 2500 : 1800; f.Q.value = 0.7;
        const g = c.createGain(); g.gain.value = 1.6;
        s.connect(f); f.connect(g); g.connect(c.destination); s.start(t0 + d);
      });
    } else {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = tur === "tekrar" ? 660 : 200;
      g.gain.setValueAtTime(0.3, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.3);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + 0.32);
    }
  }catch(e){}
}
/* Kamera ekranı.
   Tek okuma: karekodOku() → okunan yazı (ya da null).
   Sürekli okuma: karekodOku({isle: async yazi => "ekranda gösterilecek mesaj"}) → "Bitti"ye basılınca null döner. */
function karekodOku(sec){
  sec = sec || {};
  return new Promise(async bitti => {
    const surekli = !!sec.isle;
    const d = document.createElement("div"); d.className = "tarayici";
    d.innerHTML = `<div class="video-alan"><video playsinline muted autoplay></video><div class="cerceve"></div>
        <button class="isik-btn" id="t_isik" hidden>🔦 Işık</button>
        ${surekli ? `<div class="sayac" id="t_sayac">0 kutu eklendi</div>` : ""}</div>
      <div class="alt-bar"><div id="t_yazi" style="margin-bottom:10px">${surekli ? "Kutuları <b>sırayla</b> okutun; her kutu kendiliğinden eklenir." : "İlaç kutusundaki <b>küçük kare kodu</b> çerçevenin içine getirin."}<br><span class="kucuk-yazi" style="color:#cbd5e1">Kodu yavaşça yaklaştırıp uzaklaştırın; parlıyorsa kutuyu biraz eğin.</span></div>
      <div class="satir"><button class="btn ikincil" id="t_foto">📷 Fotoğraf çek</button><button class="btn ${surekli ? "" : "tehlike"}" id="t_iptal">${surekli ? "✓ Bitti" : "Vazgeç"}</button></div>
      <input type="file" accept="image/*" capture="environment" id="t_in" hidden></div>`;
    document.body.appendChild(d);
    const video = d.querySelector("video"), yazi = d.querySelector("#t_yazi");
    let akis = null, dur = false, zam = null, bekle = 0, sonYazi = "", sonZaman = 0, sayi = 0;
    const kapat = sonuc => {
      if(dur) return; dur = true; clearTimeout(zam);
      if(akis) akis.getTracks().forEach(t => t.stop());
      d.remove(); bitti(sonuc);
    };
    const isikla = renk => { const c = d.querySelector(".cerceve"); if(!c) return; c.style.borderColor = renk; c.style.borderWidth = "8px"; setTimeout(() => { c.style.borderColor = ""; c.style.borderWidth = ""; }, 600); };
    const bulundu = async t => {
      if(navigator.vibrate) navigator.vibrate(120);
      if(!surekli){ sesCal("ok"); isikla("#22c55e"); setTimeout(() => kapat(t), 250); return; }
      const simdi = Date.now();
      if(t === sonYazi && simdi - sonZaman < 4000) return;   // aynı kutu hâlâ kameranın önünde
      sonYazi = t; sonZaman = simdi; bekle = simdi + 1200;   // bir sonraki kutu için kısa ara
      let m = ""; try{ m = await sec.isle(t); }catch(e){ m = "Bir hata oldu, tekrar okutun."; }
      if(m && m.startsWith("✅")){ sayi++; const s = d.querySelector("#t_sayac"); if(s) s.textContent = sayi + " kutu eklendi"; sesCal("ok"); isikla("#22c55e"); }
      else if(m && m.startsWith("ℹ️")){ sesCal("tekrar"); isikla("#facc15"); }
      else { sesCal("hata"); isikla("#ef4444"); }
      yazi.innerHTML = m + `<br><span class="kucuk-yazi" style="color:#cbd5e1">Sıradaki kutuyu okutun ya da <b>Bitti</b>'ye dokunun.</span>`;
    };
    d.querySelector("#t_iptal").onclick = () => kapat(null);
    const inp = d.querySelector("#t_in");
    d.querySelector("#t_foto").onclick = () => inp.click();
    inp.onchange = async () => {
      const f = inp.files[0]; inp.value = ""; if(!f) return;
      yazi.innerHTML = "Fotoğraf inceleniyor…";
      let t = null; try{ t = await resimdenOku(f); }catch(e){}
      if(t) bulundu(t);
      else yazi.innerHTML = "<b>Fotoğrafta kod bulunamadı.</b><br>Kare kodu ortalayıp yakından, net ve iyi ışıkta tekrar çekin.";
    };
    sesHazirla(); wasmYukle().catch(() => {});
    try{
      akis = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080}}});
      if(dur){ akis.getTracks().forEach(t => t.stop()); return; }
      video.srcObject = akis; await video.play().catch(() => {});
      try{
        const iz = akis.getVideoTracks()[0], cap = iz.getCapabilities ? iz.getCapabilities() : {}, adv = [];
        if(cap.focusMode && cap.focusMode.includes("continuous")) adv.push({focusMode:"continuous"});
        if(cap.zoom && cap.zoom.max >= 1.5) adv.push({zoom: Math.min(cap.zoom.max, 2)});
        if(adv.length) await iz.applyConstraints({advanced:adv});
        if(cap.torch){
          const b = d.querySelector("#t_isik"); let acik = false; b.hidden = false;
          b.onclick = async () => { acik = !acik; try{ await iz.applyConstraints({advanced:[{torch:acik}]}); b.classList.toggle("on", acik); }catch(e){} };
        }
      }catch(e){}
      const yerli = await yerliOkuyucu();
      let sira = 0;
      const tara = async () => {
        if(dur) return;
        if(Date.now() >= bekle && video.readyState >= 2 && video.videoWidth){
          let t = null;
          try{
            // Android: telefonun kendi okuyucusu; her 3 denemeden birinde (iPhone'da hep) ZXing de dener
            if(yerli && sira % 3 !== 2){ const r = await yerli.detect(video); if(r.length) t = r[0].rawValue; }
            else { const oran = [0.6, 0.4, 0.85][Math.floor(sira / 3) % 3]; t = await wasmOku(ortaKes(video, video.videoWidth, video.videoHeight, oran, 900)); }
          }catch(e){}
          sira++;
          if(t){ await bulundu(t); if(dur) return; }
        }
        zam = setTimeout(tara, 100);
      };
      tara();
    }catch(e){
      if(!dur) yazi.innerHTML = "Kamera açılamadı. Telefon sorarsa <b>kameraya izin verin</b> ya da <b>Fotoğraf çek</b>e dokunun.";
    }
  });
}

let _gruplar = [];
function grupOzet(kutular){

async function stokKutuEkle(t){

  let s;

}

function dolabiPaylas(){
  const bugun = bugunStr(), g = s => sktDurum(s.skt).g;
  const satir = s => `• ${s.ad} — ${s.adet} kutu · SKT: ${s.skt ? sktYaz(s.skt) : "girilmedi"}${s.yer ? " · " + s.yer : ""}`;
  const st = V.stok.filter(s => s.adet > 0);
  const iyi = st.filter(s => g(s) > 60).sort((a,b) => a.ad.localeCompare(b.ad, "tr"));
  const yakin = st.filter(s => g(s) >= 0 && g(s) <= 60).sort((a,b) => g(a) - g(b));
  const gec = st.filter(s => g(s) < 0);
  const p = [`💊 İlaç dolabım (${tarihKisa(bugun)})`];
  if(iyi.length) p.push("", "✅ Kullanılabilir:", ...iyi.map(satir));
  if(yakin.length) p.push("", "⏳ Tarihi 60 gün içinde doluyor:", ...yakin.map(satir));
  if(gec.length) p.push("", "⚠️ Tarihi geçmiş (kullanılmamalı):", ...gec.map(satir));
  p.push("", "BEKAPSAĞLIK ile hazırlandı");
  const metin = p.join("\n");
  if(navigator.share){ navigator.share({title:"İlaç dolabım", text:metin}).catch(() => {}); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(metin) : Promise.reject()).then(
    () => serit("📋 Liste kopyalandı", "WhatsApp'ta sohbeti açıp mesaj kutusuna yapıştırın."),
    () => pencere(`<h3>📤 Dolap listesi</h3><p class="bilgi">Aşağıdaki yazıyı seçip kopyalayın.</p><label class="alan"><textarea readonly style="min-height:300px">${esc(metin)}</textarea></label><button class="btn genis" onclick="kapat()">Kapat</button>`));
}
/* Reçetedeki / takipteki ilaç evde var mı? */
function adAnahtar(ad){ return kucuk(String(ad||"").split(",")[0]).replace(/\s+/g, " ").trim(); }
function stokKarsilastir(k){
  const bugun = bugunStr(), saglam = s => !s.skt || gunFarki(bugun, s.skt) >= 0;
  const tam = V.stok.filter(s => s.adet > 0 && ((k.barkod && s.barkod === k.barkod) || (adAnahtar(k.ad) && adAnahtar(s.ad) === adAnahtar(k.ad))));
  if(tam.length){
    const iyi = tam.filter(saglam);
    if(iyi.length){
      const kutu = iyi.reduce((t,s) => t + s.adet, 0), en = iyi.map(s => s.skt).filter(Boolean).sort()[0];
      const yakin = en && gunFarki(bugun, en) <= 60;
      return `<div class="durum-satir ${yakin ? "d-yakin" : "d-var"}">✅ Evde var: ${kutu} kutu${en ? " · son kullanma " + sktYaz(en) : ""}${yakin ? " (tarihi yaklaşıyor)" : ""}</div>`;
    }
    return `<div class="durum-satir d-gecmis">⚠️ Evde var ama son kullanma tarihi geçmiş (${tam.map(s => sktYaz(s.skt)).join(", ")}). Kullanmayın.</div>`;
  }
  const et = kucuk(k.etken).trim();
  if(et){
    const b = V.stok.filter(s => s.adet > 0 && kucuk(s.etken).trim() === et && saglam(s));
    if(b.length) return `<div class="durum-satir d-benzer">ℹ️ Evde aynı etken maddeli başka bir ilaç var: ${b.map(s => esc(s.ad)).join(", ")}. Doz ya da biçimi farklı olabilir; kullanmadan önce eczacınıza sorun.</div>`;
  }
  return `<div class="durum-satir d-yok">🛒 Evde yok</div>`;
}

  Object.assign(r, {tarih:deg("f_tar"), no:deg("f_no"), doktor:deg("f_dok"), hastane:deg("f_has"), kalemler:FORM_KALEM.slice(), fotolar:FORM_FOTO.slice()});
  eskiFoto.filter(f => !r.fotolar.includes(f)).forEach(f => fotoSilDB(f).catch(() => {}));
  if(!id) V.receteler.push(r);
  kaydet(); kapat(); if(durum.ekran === "kisi") durum.sekme = "recete"; ciz();
}
function receteSil(id){
  const r = V.receteler.find(x => x.id === id); if(!confirm("Bu reçete silinsin mi?")) return;
  (r.fotolar||[]).forEach(f => fotoSilDB(f).catch(() => {}));
  V.receteler = V.receteler.filter(x => x !== r); kaydet(); kapat(); ciz();
}
function listeBilgisi(){
  ilacListesi().then(L => { const y = document.getElementById("liste_bilgi"); if(y) y.textContent = "İlaç listesi: Sağlık Bakanlığı (TİTCK) Ruhsatlı Beşeri Tıbbi Ürünler Listesi, " + tarihKisa(L.tarih) + " · " + L.liste.length.toLocaleString("tr") + " ilaç."; }).catch(() => {});
}

/* ============ TELEFONA KURMA YARDIMI ============ */
let _kurOlay = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); _kurOlay = e; if(durum.ekran === "bugun" || durum.ekran === "ayarlar") ciz(); });
window.addEventListener("appinstalled", () => { _kurOlay = null; ciz(); });
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
function kuruluMu(){ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }
function kurBandi(){
  if(kuruluMu() || V.ayar.kurGizle) return "";
  return `<div class="kur-bant"><div style="flex:1"><b>📲 BEKAPSAĞLIK'ı telefonuna kur</b><div>Simgesiyle açılsın, internetsiz çalışsın.</div></div>
    <button class="btn kucuk" onclick="kurulumYardim()">Nasıl?</button><button class="kapat-x" aria-label="Kapat" onclick="V.ayar.kurGizle=1;kaydet();ciz()">✕</button></div>`;
}
async function kurulumYardim(plat){
  const iosAdim = plat ? plat === "ios" : IOS;
  if(!iosAdim && _kurOlay){ _kurOlay.prompt(); try{ await _kurOlay.userChoice; }catch(e){} _kurOlay = null; ciz(); return; }
  const ua = navigator.userAgent, safariDisi = IOS && /CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(ua);
  const ios = `<ol class="adimlar">
      ${safariDisi ? `<li><b>Bu sayfayı Safari'de açın.</b> Kurulum yalnız Safari'den yapılır (pusula simgeli uygulama). Adresi kopyalayıp Safari'ye yapıştırın.</li>` : ""}
      <li>Ekranın altındaki <b>Paylaş</b> düğmesine dokunun <span class="ikon-kutu">⬆️</span> (içinden yukarı ok çıkan kutu). Göremiyorsanız sayfayı biraz yukarı kaydırın.</li>
      <li>Açılan listeyi yukarı kaydırın, <b>“Ana Ekrana Ekle”</b> <span class="ikon-kutu">➕</span> yazısına dokunun.</li>
      <li>Sağ üstteki <b>“Ekle”</b>ye dokunun.</li>
      <li>Ana ekranda çıkan yeşil <b>BEKAPSAĞLIK</b> simgesinden açın.</li></ol>`;
  const android = `<ol class="adimlar">
      <li>Sağ üstteki <b>⋮</b> (üç nokta) menüsüne dokunun.</li>
      <li><b>“Uygulamayı yükle”</b> ya da <b>“Ana ekrana ekle”</b>ye dokunun, sonra <b>“Yükle”</b>.</li>
      <li>Bir dakika içinde ana ekranda yeşil <b>BEKAPSAĞLIK</b> simgesi çıkar; oradan açın.</li></ol>
      <p class="bilgi">WhatsApp'ın içinde açtıysanız önce sağ üstteki ⋮ menüsünden <b>“Chrome'da aç”</b>ı seçin.</p>`;
  pencere(`<h3>${iosAdim ? "🍎 iPhone'a kurma" : "🤖 Android'e kurma"}</h3>${iosAdim ? ios : android}<button class="btn genis" onclick="kapat()">Anladım</button>`);
}
function karsilamaGoster(){ return !kuruluMu() && !V.ayar.tarayicidaDevam && !V.kisiler.length; }
function ekranKarsilama(){
  const ad = _kurOlay ? "🤖 Android'e yükle" : "🤖 Android'e yükle";
  return `<div class="karsilama">
    <img src="ikon-192.png" alt="" class="k-ikon">
    <h1>BEKAPSAĞLIK</h1>
    <p class="k-alt">Ailenizin sağlık takibi, tek yerde.</p>
    <ul class="k-liste">
      <li>🩺 Doktor randevuları ve doktorun söyledikleri</li>
      <li>💊 İlaç saatleri: sabah, öğle, akşam; aç ya da tok</li>
      <li>🧪 Tahliller ve sonuçları</li>
      <li>📋 Reçeteler ve evdeki ilaç dolabı</li>
    </ul>
    <div class="k-dugmeler">
      <button class="btn k-btn ${IOS ? "on" : ""}" onclick="kurulumYardim('ios')">🍎 iPhone'a yükle</button>
      <button class="btn k-btn ${!IOS ? "on" : ""}" onclick="kurulumYardim('android')">${ad}</button>
    </div>
    <p class="k-guven">🔒 Bilgileriniz yalnız kendi telefonunuzda saklanır, hiçbir yere gönderilmez. Ücretsiz.</p>
    <button class="k-devam" onclick="V.ayar.tarayicidaDevam=1;kaydet();ciz()">Kurmadan, tarayıcıda devam et</button>
  </div>`;
}
/* ============ AYARLAR ============ */
function ekranAyarlar(){
  const izin = !("Notification" in window) ? "yok" : Notification.permission;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const kurulu = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  return `
  <div class="kart"><div class="baslik">🔔 Bildirimler</div>
    <p class="bilgi">Uygulama <b>açıkken</b> ilaç saatlerinde ve randevulardan önce ekranda uyarı çıkar, telefon titrer.</p>
    <p class="bilgi">Uygulama <b>kapalıyken</b> de haber almak için her ilacın ve randevunun içindeki <b>“📲 Telefonun takvimine alarm ekle”</b> düğmesini kullanın. Alarmı telefonunuzun kendi takvimi çalar.</p>
    ${izin === "granted" ? `<p><span class="etiket e-yesil">Bildirim izni verildi</span></p>` :
      izin === "yok" ? `<p class="bilgi">Bu tarayıcı bildirim desteklemiyor${ios && !kurulu ? " — iPhone'da önce uygulamayı ana ekrana ekleyin" : ""}.</p>` :
      `<button class="btn genis" onclick="izinIste()">Bildirimlere izin ver</button>`}
  </div>
  <div class="kart"><div class="baslik">💾 Yedek</div>
    <p class="bilgi">Bütün bilgiler yalnız bu telefonda durur. Telefon değişirse ya da tarayıcı verileri silinirse bilgiler kaybolur. Ayda bir yedek almanızı öneririz.</p>
    <div class="islemler"><button class="btn" onclick="yedekAl()">⬇️ Yedek al</button>
    <button class="btn ikincil" onclick="document.getElementById('yedek-dosya').click()">⬆️ Yedekten geri yükle</button></div>
    <input type="file" id="yedek-dosya" accept=".json,application/json" hidden onchange="yedekYukle(this)">
    ${V.ayar.sonYedek ? `<p class="kucuk-yazi">Son yedek: ${tarihKisa(V.ayar.sonYedek)}</p>` : ""}
  </div>
  ${!kurulu ? `<div class="kart"><div class="baslik">📱 Telefona kur</div>
    <p class="bilgi">BEKAPSAĞLIK'ı ana ekrana eklerseniz diğer uygulamalar gibi simgesiyle açılır ve internetsiz çalışır.</p>
    <button class="btn genis" onclick="kurulumYardim()">${_kurOlay ? "📲 Şimdi yükle" : "📲 Nasıl kurulur?"}</button></div>` : ""}
  <div class="kart"><div class="baslik">ℹ️ Hakkında</div>
    <p class="bilgi">BEKAPSAĞLIK · ${V.kisiler.length} kişi · ${V.ilaclar.length} ilaç · ${V.randevular.length} randevu · ${V.tahliller.length} tahlil · ${V.receteler.length} reçete · dolapta ${V.stok.length} ilaç</p>
    <p class="bilgi" id="liste_bilgi"></p>
    <p class="bilgi">Bu uygulama hiçbir yerden veri çekmez ve hiçbir yere veri göndermez. Tıbbi tavsiye vermez; ilaç ve tedavi konusunda her zaman doktorunuza danışın.</p>
    <button class="btn tehlike kucuk" onclick="hepsiniSil()">Bütün bilgileri sil</button></div>`;
}
function izinIste(){ Notification.requestPermission().then(() => ciz()); }
/* Yedek hatırlatması: 30 günde bir (hiç yedek yoksa ilk kullanımdan 3 gün sonra) */
function yedekGunu(){
  if(!V.kisiler.length) return null;
  if(!V.ayar.ilkKullanim){ V.ayar.ilkKullanim = bugunStr(); kaydet(); }
  const bugun = bugunStr();
  if(V.ayar.yedekErtele && gunFarki(bugun, V.ayar.yedekErtele) > 0) return null;
  if(V.ayar.sonYedek){ const g = gunFarki(V.ayar.sonYedek, bugun); return g >= 30 ? g : null; }
  return gunFarki(V.ayar.ilkKullanim, bugun) >= 3 ? -1 : null;
}
function yedekBandi(){
  const g = yedekGunu(); if(g === null) return "";
  return `<div class="uyari yedek-bant"><b>💾 ${g < 0 ? "Henüz hiç yedek almadınız." : "Son yedeğiniz " + g + " gün önce."}</b>
    Telefon değişir ya da bozulursa bilgileriniz kaybolmasın.
    <div class="islemler"><button class="btn kucuk" onclick="yedekAl()">💾 Şimdi yedek al</button>
    <button class="btn ikincil kucuk" onclick="yedekErtele()">Sonra hatırlat</button></div></div>`;
}
function yedekErtele(){ const d = new Date(); d.setDate(d.getDate() + 3); V.ayar.yedekErtele = bugunStr(d); kaydet(); ciz(); }
function yedekAl(){
  pencere(`<h3>💾 Yedek al</h3>
    <p>Birazdan telefonun <b>paylaşım ekranı</b> açılacak. Yedek dosyasını güvenli bir yere kaydedin:</p>
    <ul class="adimlar">
      <li><b>Google Drive</b>'ı seçin <span class="kucuk-yazi">(Android ve iPhone)</span></li>
      <li>ya da <b>“Dosyalar'a Kaydet” → iCloud Drive</b> <span class="kucuk-yazi">(iPhone)</span></li>
      <li>ya da <b>Gmail</b>'i seçip <b>kendinize e-posta</b> olarak gönderin</li></ul>
    <p class="bilgi">Telefon değişirse yeni telefonda Ayarlar → <b>“Yedekten geri yükle”</b> ile bu dosyayı seçince her şey geri gelir.</p>
    <div class="satir"><button class="btn ikincil" onclick="kapat()">Vazgeç</button><button class="btn" onclick="kapat();yedekGonder()">Devam</button></div>`);
}
async function yedekGonder(){
  let fotolar = {}; try{ fotolar = await fotoHepsi(); }catch(e){}
  const tamam = () => { V.ayar.sonYedek = bugunStr(); delete V.ayar.yedekErtele; kaydet(); ciz(); };
  const blob = new Blob([JSON.stringify(Object.assign({}, V, {fotolar}))], {type:"application/json"});
  const ad = "bekapsaglik-yedek-" + bugunStr() + ".json";
  try{ const f = new File([blob], ad, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:ad}); tamam(); serit("✅ Yedek hazırlandı", "Bir sonraki hatırlatma 30 gün sonra."); return; } }catch(e){ if(e && e.name === "AbortError"){ ciz(); return; } }
  const u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = ad; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
  tamam(); serit("✅ Yedek dosyası indirildi", ad + " · İndirilenler klasöründe. Google Drive'a da kaydedin.");
}
function yedekYukle(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.kisiler)) throw 0;
      if(!confirm(`Yedekte ${d.kisiler.length} kişi var. Şu anki bilgilerin YERİNE yüklensin mi?`)) return;
      const fotolar = d.fotolar || {}; delete d.fotolar;
      await fotoHepsiniSil();
      for(const k of Object.keys(fotolar)){ try{ await fotoKoy(k, fotolar[k]); }catch(e){} }
      V = Object.assign(bos(), d); kaydet(); alert("Yedek yüklendi."); gecmis.length = 0; durum = {ekran:"bugun"}; ciz();
    }catch(e){ alert("Bu dosya BEKAPSAĞLIK yedeği değil."); }
  };
  r.readAsText(f); inp.value = "";
}
function hepsiniSil(){
  if(!confirm("Bütün kişiler, ilaçlar, randevular ve tahliller silinecek. Emin misiniz?")) return;
  if(!confirm("Son kez soruyorum: geri alınamaz. Silinsin mi?")) return;
  V = bos(); kaydet(); fotoHepsiniSil(); gecmis.length = 0; durum = {ekran:"bugun"}; ciz();
}

/* ============ BAŞLAT ============ */
ciz();
fotoTemizle();
kontrol();
setInterval(() => { kontrol(); }, 30000);
let sonGun = bugunStr();
setInterval(() => { if(bugunStr() !== sonGun){ sonGun = bugunStr(); if(durum.ekran === "bugun") ciz(); } }, 60000);
document.addEventListener("visibilitychange", () => { if(!document.hidden){ kontrol(); if(durum.ekran === "bugun") ciz(); } });
if("serviceWorker" in navigator && location.protocol !== "file:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
</script>
